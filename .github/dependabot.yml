# Dependabot (paso 5 del plan de seguridad): revisa cada semana si alguna
# librería tiene una versión nueva o una vulnerabilidad conocida y abre un PR
# para actualizarla. Ese PR pasa por el mismo CI que todo lo demás.
version: 2
updates:
  - package-ecosystem: npm
    directory: /Backend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Las actualizaciones menores y parches llegan juntas en un solo PR.
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Las acciones de los workflows (actions/checkout, setup-node…).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
